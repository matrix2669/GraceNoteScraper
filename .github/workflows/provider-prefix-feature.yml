# Isolated feature validation only. Container/release workflows stay untouched.
# Private captured inventory/decisions are never uploaded to CI.
name: Provider Prefix Feature CI

"on":
  push:
    branches: [feature/unified-stream-review]

permissions:
  contents: read

concurrency:
  group: provider-prefix-feature-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go, matcher contracts and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact feature revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install isolated matcher and browser test dependencies
        run: |
          python -m pip install rapidfuzz==3.14.5 gevent==26.8.0
          npm install --prefix "$RUNNER_TEMP/provider-prefix-browser" --no-audit --no-fund --ignore-scripts playwright@1.65.1
          node "$RUNNER_TEMP/provider-prefix-browser/node_modules/playwright/cli.js" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/provider-prefix-browser/node_modules" >> "$GITHUB_ENV"
      - name: Formatting and module integrity
        run: |
          test -z "$(gofmt -l .)"
          git diff --check
          go mod verify
      - name: Full Go suite
        run: go test ./...
      - name: Race suite
        run: go test -race ./...
      - name: Static analysis
        run: go vet ./...
      - name: Native and release-platform compilation only
        run: |
          go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/gracenote-native" .
          for platform in linux/amd64 linux/arm64 windows/amd64; do
            CGO_ENABLED=0 GOOS="${platform%/*}" GOARCH="${platform#*/}" \
              go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/gracenote-${platform//\//-}" .
          done
      - name: Serialized JSON contracts and Python regressions
        run: |
          for script in scripts/check_automatic_exclusion_contract.py \
                        scripts/check_inventory_exclusion_contract.py \
                        scripts/check_affiliate_exclusion_contract.py \
                        scripts/check_identity_representation_contract.py \
                        tools/test_matcher_attribution.py \
                        tools/test_verified_station_catalog.py \
                        tools/test_provider_prefix_replay.py; do
            echo "=== $script"
            python -B "$script"
          done
      - name: All Node and real-browser regression suites
        run: |
          shopt -s nullglob
          suites=(scripts/test_*.cjs tools/test_*.cjs)
          test "${#suites[@]}" -gt 0
          for suite in "${suites[@]}"; do
            echo "=== $suite"
            node "$suite"
          done
          echo "Passed ${#suites[@]} Node/browser suites"
      - name: Check tests did not change tracked source
        run: git diff --exit-code
